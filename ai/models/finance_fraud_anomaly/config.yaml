# Finance — Transaction Fraud Anomaly Detector Configuration


model:
  name: fraud_anomaly_detector
  version: "1.0.0"
  description: Isolation Forest anomaly detection on transaction data
  base_type: ANOMALY_DETECTOR
  domain: finance

architecture:
  type: isolation_forest

  params:
    n_estimators: 50
    max_samples: 0.8
    contamination: 0.05
    max_features: 0.8
    n_features: 30

input:
  type: numeric
  shape: [1, 30]
  normalization: standard
  features:
    # Column order of the training data (written by preprocessing).
    - Time
    - V1
    - V2
    - V3
    - V4
    - V5
    - V6
    - V7
    - V8
    - V9
    - V10
    - V11
    - V12
    - V13
    - V14
    - V15
    - V16
    - V17
    - V18
    - V19
    - V20
    - V21
    - V22
    - V23
    - V24
    - V25
    - V26
    - V27
    - V28
    - Amount

training:
  test_size: 0.2
  random_state: 42
  use_only_benign: true

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc

export:
  format: onnx
  opset_version: 17
  optimize: true
