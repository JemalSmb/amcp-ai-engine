# Finance — Transaction Fraud Anomaly Detector Configuration


model:
  name: fraud_anomaly_detector
  version: "1.0.0"
  description: Isolation Forest anomaly detection on transaction data
  base_type: ANOMALY_DETECTOR
  domain: finance

architecture:
  type: isolation_forest

  params:
    n_estimators: 50
    max_samples: 0.8
    contamination: 0.05
    max_features: 0.8
    n_features: 20

input:
  type: numeric
  shape: [1, 20]
  normalization: standard
  features:
    # Transaction features
    - amount
    - hour_of_day
    - day_of_week
    - txn_count_last_hour
    - txn_count_last_day
    - avg_amount_last_7d
    - amount_deviation
    - is_international
    - merchant_category
    - payment_method
    # User behavior features
    - days_since_last_txn
    - device_change
    - location_distance_km
    - new_merchant
    - is_recurring
    # Risk indicators
    - velocity_1h
    - velocity_24h
    - amount_to_balance_ratio
    - failed_attempts_24h
    - account_age_days

training:
  test_size: 0.2
  random_state: 42
  use_only_benign: true

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc

export:
  format: onnx
  opset_version: 17
  optimize: true
