# Phishing Classifier Model Configuration

model:
  name: phishing_classifier
  version: "1.0.0"
  description: Binary classification for phishing URL/email detection

architecture:
  type: random_forest

  params:
    n_estimators: 500
    max_depth: 30
    min_samples_split: 3
    min_samples_leaf: 2
    max_features: "sqrt"
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  output:
    num_classes: 2
    classes:
      - legitimate
      - phishing

input:
  type: numeric
  shape: [1, 48]
  normalization: standard
  features:
    # Column order of Phishing_Legitimate_full.csv (the 48 features the shipped classifier was trained on).
    - NumDots
    - SubdomainLevel
    - PathLevel
    - UrlLength
    - NumDash
    - NumDashInHostname
    - AtSymbol
    - TildeSymbol
    - NumUnderscore
    - NumPercent
    - NumQueryComponents
    - NumAmpersand
    - NumHash
    - NumNumericChars
    - NoHttps
    - RandomString
    - IpAddress
    - DomainInSubdomains
    - DomainInPaths
    - HttpsInHostname
    - HostnameLength
    - PathLength
    - QueryLength
    - DoubleSlashInPath
    - NumSensitiveWords
    - EmbeddedBrandName
    - PctExtHyperlinks
    - PctExtResourceUrls
    - ExtFavicon
    - InsecureForms
    - RelativeFormAction
    - ExtFormAction
    - AbnormalFormAction
    - PctNullSelfRedirectHyperlinks
    - FrequentDomainNameMismatch
    - FakeLinkInStatusBar
    - RightClickDisabled
    - PopUpWindow
    - SubmitInfoToEmail
    - IframeOrFrame
    - MissingTitle
    - ImagesOnlyInForm
    - SubdomainLevelRT
    - UrlLengthRT
    - PctExtResourceUrlsRT
    - AbnormalExtFormActionR
    - ExtMetaScriptLinkRT
    - PctExtNullSelfRedirectHyperlinksRT

training:
  test_size: 0.2
  random_state: 42

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc
    - confusion_matrix

  thresholds:
    default: 0.5
    high_precision: 0.8
    high_recall: 0.3

export:
  format: onnx
  opset_version: 17
  optimize: true
