# Anomaly Detector Model Configuration


model:
  name: anomaly_detector
  version: "1.0.0"
  description: Unsupervised anomaly detection for IoT/network traffic

architecture:
  type: isolation_forest

  params:
    n_estimators: 200
    max_samples: 4096
    contamination: 0.05
    max_features: 0.8
    random_state: 42

  output:
    type: anomaly_score
    threshold: 0.5

input:
  type: numeric
  shape: [1, 41]
  normalization: standard
  features:
    # Column order of the training data (written by preprocessing).
    - duration
    - protocol_type
    - service
    - flag
    - src_bytes
    - dst_bytes
    - land
    - wrong_fragment
    - urgent
    - hot
    - num_failed_logins
    - logged_in
    - num_compromised
    - root_shell
    - su_attempted
    - num_root
    - num_file_creations
    - num_shells
    - num_access_files
    - num_outbound_cmds
    - is_host_login
    - is_guest_login
    - count
    - srv_count
    - serror_rate
    - srv_serror_rate
    - rerror_rate
    - srv_rerror_rate
    - same_srv_rate
    - diff_srv_rate
    - srv_diff_host_rate
    - dst_host_count
    - dst_host_srv_count
    - dst_host_same_srv_rate
    - dst_host_diff_srv_rate
    - dst_host_same_src_port_rate
    - dst_host_srv_diff_host_rate
    - dst_host_serror_rate
    - dst_host_srv_serror_rate
    - dst_host_rerror_rate
    - dst_host_srv_rerror_rate

training:
  test_size: 0.2
  random_state: 42
  use_only_benign: true

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc
    - confusion_matrix

  thresholds:
    default: 0.5
    high_precision: 0.7
    high_recall: 0.3

export:
  format: onnx
  opset_version: 17
  optimize: true
